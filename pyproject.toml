[project]
name = "codingagent"
version = "0.1.0"
description = "This is a sandboxed coding agent"
readme = "README.md"
authors = [
    { name = "Pushkar Tiwari", email = "pushkar.bpl20@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "docker>=7.2.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "typer>=0.27.3",
]

[project.scripts]
codingagent = "codingagent:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100  # Sets Ruff's maximum preferred line length.
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]  # Enables rules for common errors, imports, modern Python syntax, bug-prone patterns, simplifications, and annotations.
 
[tool.mypy]
strict = true  # Enables rigorous static type checking with mypy.
files = ["src"]  # Tells mypy to check application code under src.

[tool.pytest.ini_options]
testpaths = ["tests"]  # Tells pytest where to discover tests.
pythonpath = ["src"]   # Lets tests import your source package from the src directory.
